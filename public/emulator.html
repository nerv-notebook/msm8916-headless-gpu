<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>正在游玩 - RetroStick</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🕹️</text></svg>">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body, html {
      width: 100%;
      height: 100%;
      background-color: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .top-bar {
      height: 48px;
      background: #0d121c;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      z-index: 1000;
      flex-shrink: 0;
    }
    .top-left, .top-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .btn-nav {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #f1f5f9;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .btn-nav:hover {
      background: rgba(0, 242, 254, 0.2);
      border-color: #00f2fe;
      color: #00f2fe;
    }
    .game-name {
      font-size: 14px;
      font-weight: 700;
      color: #00f2fe;
      letter-spacing: 0.5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 40vw;
    }
    .player-container {
      flex-grow: 1;
      width: 100%;
      height: calc(100% - 48px);
      position: relative;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #game {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <div class="top-left">
      <a href="/" class="btn-nav">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        大厅
      </a>
      <span class="game-name" id="gameTitle">RetroStick Player</span>
    </div>

    <div class="top-right">
      <button class="btn-nav" id="btnFullscreen" onclick="toggleFullscreen()">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path></svg>
        全屏
      </button>
    </div>
  </div>

  <div class="player-container">
    <div id="game"></div>
  </div>

  <script>
    // Extract query parameters
    const params = new URLSearchParams(window.location.search);
    const system = params.get('system') || 'gba';
    const core = params.get('core') || 'gba';
    const gameUrl = params.get('game');
    const title = params.get('title') || 'Retro Game';
    const gameId = params.get('id') || 'game';

    document.getElementById('gameTitle').textContent = title;
    document.title = `${title} - RetroStick`;

    if (!gameUrl) {
      alert('未指定游戏 ROM 路径，返回大厅');
      window.location.href = '/';
    }

    // EmulatorJS Global Configurations
    window.EJS_player = '#game';
    window.EJS_core = core;
    window.EJS_gameUrl = gameUrl;
    window.EJS_gameID = gameId;
    window.EJS_startOnLoaded = true;
    window.EJS_color = '#00f2fe';
    window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
    window.EJS_language = 'zh-CN';

    // Cloud Save Sync hook
    window.EJS_onSave = function(e) {
      console.log('Game saving state to RetroStick cloud...');
      if (e && e.state) {
        fetch(`/api/saves/${gameId}`, {
          method: 'POST',
          body: e.state
        }).then(r => r.json())
          .then(data => console.log('Cloud save synchronized:', data))
          .catch(err => console.error('Save sync failed:', err));
      }
    };

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }
  </script>
  <!-- EmulatorJS Loader -->
  <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
</body>
</html>
